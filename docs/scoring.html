<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORMRHL Scoring Race</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
  <nav class="page-nav">
    <a href="index.html">Home</a>
    <a href="standings.html">Standings Race</a>
    <a href="scoring.html" class="active">Scoring Race</a>
  </nav>
  <div class="race-card" id="scoring-race"></div>
  <script src="race-chart.js?v=2"></script>
  <script>
    renderBarChartRace("scoring-race", "data/scoring_race.csv", {
      dateField: "game_date",
      labelField: "player_slug",
      displayField: "player_name",
      teamField: "team",
      iconField: "team_icon",
      colorField: "team_color",
      seasonKeyField: "season_key",
      seasonTypeField: "season_type",
      numericFields: ["cumulative_goals", "cumulative_assists", "cumulative_points"],
      metricOptions: [
        { key: "points", label: "Points", field: "cumulative_points",
          breakdown: { goals: "cumulative_goals", assists: "cumulative_assists" } },
        { key: "goals", label: "Goals", field: "cumulative_goals" },
        { key: "assists", label: "Assists", field: "cumulative_assists" },
      ],
      defaultMetric: "points",
      topN: 10,
      title: "Top Scorers",
      stepDurationMs: 800,
    });
  </script>
</body>
</html>
