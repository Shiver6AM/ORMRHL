name: Daily ORMRHL Scrape

on:
  schedule:
    - cron: "15 11 * * *"   # 11:15 UTC daily (~07:15 Toronto during EDT)
  workflow_dispatch:        # allow manual runs

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          # Secrets (encrypted)
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
          # Variables (easy to tweak)
          GOOGLE_SHEETS_DOC_NAME: ${{ vars.GOOGLE_SHEETS_DOC_NAME }}
          WORKSHEET_NAME: ${{ vars.WORKSHEET_NAME }}
          EVENT_START: ${{ vars.EVENT_START }}
          EVENT_END: ${{ vars.EVENT_END }}
          # Optional tuning
          REQUEST_SLEEP: "0.4"
        run: |
          python run_player_scrape.py
